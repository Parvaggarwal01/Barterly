name: Feature request
description: Suggest a new feature or improvement.
title: "feat: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for meaningful product, UX, API, or developer-experience improvements.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend
        - Authentication
        - Skills
        - Barter requests
        - Chat
        - Admin
        - Documentation
        - Dev tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for users, admins, contributors, or maintainers?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or implementation you are proposing.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any other approaches you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, references, or examples if useful.
    validations:
      required: false
